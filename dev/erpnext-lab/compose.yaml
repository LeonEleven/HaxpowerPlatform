name: haxpower-erpnext-v16-lab

services:
  mariadb:
    image: ${MARIADB_IMAGE:?Run prepare.py first}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-snapshot-isolation=OFF
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
      MARIADB_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    secrets:
      - mariadb_root_password
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 2g
    cpus: 2
    pids_limit: 256

  redis-cache:
    image: ${REDIS_IMAGE:?Run prepare.py first}
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 128mb, --maxmemory-policy, allkeys-lru, --protected-mode, "no"]
    networks:
      - backend
    tmpfs:
      - /data:rw,noexec,nosuid,size=64m,mode=1777
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 6
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

  redis-queue:
    image: ${REDIS_IMAGE:?Run prepare.py first}
    command: [redis-server, --save, "", --appendonly, "yes", --maxmemory, 128mb, --maxmemory-policy, noeviction, --protected-mode, "no"]
    volumes:
      - redis-queue-data:/data
    networks:
      - backend
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 6
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

  frappe:
    image: ${BENCH_IMAGE:?Run prepare.py first}
    entrypoint: []
    command: [sleep, infinity]
    init: true
    user: "1000:1000"
    working_dir: /workspace/development
    environment:
      SHELL: /bin/bash
      TZ: Asia/Shanghai
    volumes:
      - type: bind
        source: ${LAB_ROOT:?Run prepare.py first}/workspace
        target: /workspace/development
    networks:
      backend: {}
      egress:
        gw_priority: 1
    depends_on:
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import sys; assert sys.version_info[:2] == (3, 14)"]
      interval: 30s
      timeout: 5s
      retries: 3
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    cpus: 4
    pids_limit: 512

secrets:
  mariadb_root_password:
    file: ${LAB_ROOT:?Run prepare.py first}/secrets/mariadb-root-password

volumes:
  mariadb-data: {}
  redis-queue-data: {}

networks:
  backend:
    internal: true
  egress:
    driver: bridge
