name: V1 engineering

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  isolated-install-and-migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HP_V1_PROJECT: haxpower-v1-ci-${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set run-scoped loopback ports
        env:
          RUN_NUMBER: ${{ github.run_id }}
        run: |
          [[ "$RUN_NUMBER" =~ ^[1-9][0-9]{0,19}$ ]]
          offset=$((10#${RUN_NUMBER: -2}))
          printf 'HP_V1_WEB_PORT=%s\nHP_V1_SOCKET_PORT=%s\n' "$((8100 + offset))" "$((9100 + offset))" >> "$GITHUB_ENV"

      - name: Static checks and isolated Compose preflight
        run: |
          mkdir -p "$RUNNER_TEMP/hp-v1-evidence"
          {
            git rev-parse HEAD
            docker compose version
            git diff --check "origin/main...HEAD"
            python3 -m compileall -q apps/haxpower_v1 dev/v1
            python3 -m unittest discover -s dev/v1 -v
            python3 -O -m unittest discover -s dev/v1 -v
            python3 dev/v1/v1.py preflight
          } 2>&1 | tee "$RUNNER_TEMP/hp-v1-evidence/preflight.log"

      - name: Test warehouse access, native HTTP guards and repeatable migrations
        run: |
          {
            python3 dev/v1/v1.py up
            python3 dev/v1/v1.py prepare
            python3 dev/v1/v1.py integration
            python3 dev/v1/v1.py start
            python3 dev/v1/v1.py smoke
          } 2>&1 | tee "$RUNNER_TEMP/hp-v1-evidence/integration.log"

      - name: Remove resources owned by this run
        if: always()
        run: |
          python3 dev/v1/v1.py ci-clean 2>&1 | tee "$RUNNER_TEMP/hp-v1-evidence/cleanup.log"

      - name: Upload redacted engineering evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v1-engineering-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hp-v1-evidence/*.log
          if-no-files-found: error
          retention-days: 14
